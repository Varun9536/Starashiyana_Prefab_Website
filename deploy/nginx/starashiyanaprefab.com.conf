# Nginx reverse-proxy config for starashiyanaprefab.com — ONE file, 2 blocks:
#   1. port 80  -> just redirects everything to https
#   2. port 443 -> actually serves the site (proxies to the Docker app)
#
# Install on the VPS (copy this one file, nothing else to pick between):
#   sudo cp deploy/nginx/starashiyanaprefab.com.conf /etc/nginx/sites-available/starashiyanaprefab.com.conf
#   sudo ln -s /etc/nginx/sites-available/starashiyanaprefab.com.conf /etc/nginx/sites-enabled/
#   sudo mkdir -p /var/www/certbot
#   sudo nginx -t && sudo systemctl reload nginx
#
# Then issue the certificate (fills in the ssl_certificate lines below automatically):
#   sudo certbot --nginx -d starashiyanaprefab.com -d www.starashiyanaprefab.com
#
# The app runs in Docker, published to 127.0.0.1:3005 only (docker-compose.yml
# — port 3000 was already taken on this VPS, so the host side is remapped to
# 3005; the container's internal port stays 3000) — nginx is the only thing
# exposed to the internet on 80/443.

# ---- Block 1: HTTP — redirect everything to HTTPS --------------------------
server {
    listen 80;
    listen [::]:80;
    server_name starashiyanaprefab.com www.starashiyanaprefab.com;

    # Required so certbot can verify domain ownership before a cert exists.
    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    location / {
        return 301 https://starashiyanaprefab.com$request_uri;
    }
}

# ---- Block 2: HTTPS — the actual site ---------------------------------------
server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name starashiyanaprefab.com www.starashiyanaprefab.com;

    ssl_certificate     /etc/letsencrypt/live/starashiyanaprefab.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/starashiyanaprefab.com/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;

    # www.starashiyanaprefab.com -> starashiyanaprefab.com (keeps one canonical URL)
    if ($host = www.starashiyanaprefab.com) {
        return 301 https://starashiyanaprefab.com$request_uri;
    }

    gzip on;
    gzip_min_length 256;
    gzip_types text/plain text/css application/json application/javascript text/javascript
               text/xml application/xml application/xml+rss image/svg+xml;

    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    # Next.js build assets are content-hashed and safe to cache forever.
    location /_next/static/ {
        proxy_pass http://127.0.0.1:3005;
        proxy_set_header Host $host;
        add_header Cache-Control "public, max-age=31536000, immutable";
    }

    location / {
        proxy_pass http://127.0.0.1:3005;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_buffering off;
    }
}

# Nginx reverse-proxy config for starashiyanaprefab.com
#
# Install on the VPS:
#   sudo cp deploy/nginx/starashiyanaprefab.com.conf /etc/nginx/sites-available/starashiyanaprefab.com.conf
#   sudo ln -s /etc/nginx/sites-available/starashiyanaprefab.com.conf /etc/nginx/sites-enabled/
#   sudo mkdir -p /var/www/certbot
#   sudo nginx -t && sudo systemctl reload nginx
#
# Then issue the certificate (see DEPLOYMENT.md for the full sequence):
#   sudo certbot --nginx -d starashiyanaprefab.com -d www.starashiyanaprefab.com
#
# The app itself is expected to be running in Docker, published to
# 127.0.0.1:3000 only (see docker-compose.yml) — nginx is the only thing
# exposed to the internet on 80/443.

# ---- www -> apex redirect (HTTP) -------------------------------------------
server {
    listen 80;
    listen [::]:80;
    server_name www.starashiyanaprefab.com;
    return 301 https://starashiyanaprefab.com$request_uri;
}

# ---- ACME challenge + force HTTPS (HTTP) -----------------------------------
server {
    listen 80;
    listen [::]:80;
    server_name starashiyanaprefab.com;

    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

# ---- www -> apex redirect (HTTPS) ------------------------------------------
# Certbot's --nginx plugin will fill in the ssl_certificate directives below
# for this server block too once it has a cert covering www.
server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name www.starashiyanaprefab.com;

    ssl_certificate     /etc/letsencrypt/live/starashiyanaprefab.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/starashiyanaprefab.com/privkey.pem;

    return 301 https://starashiyanaprefab.com$request_uri;
}

# ---- Main site (HTTPS) ------------------------------------------------------
server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name starashiyanaprefab.com;

    ssl_certificate     /etc/letsencrypt/live/starashiyanaprefab.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/starashiyanaprefab.com/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_prefer_server_ciphers off;

    client_max_body_size 10M;

    gzip on;
    gzip_vary on;
    gzip_min_length 256;
    gzip_types text/plain text/css application/json application/javascript text/javascript
               text/xml application/xml application/xml+rss image/svg+xml;

    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    # Next.js build assets are content-hashed and safe to cache forever —
    # let nginx hand back the immutable header Next.js already sets, and
    # avoid re-checking with the app on every request.
    location /_next/static/ {
        proxy_pass http://127.0.0.1:3000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        add_header Cache-Control "public, max-age=31536000, immutable";
    }

    location / {
        proxy_pass http://127.0.0.1:3000;
        proxy_http_version 1.1;

        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # Kept for forward-compatibility (any future websocket usage);
        # harmless for the current plain HTTP app.
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";

        # Matches the `X-Accel-Buffering: no` header set in next.config.ts —
        # let App Router streaming responses flush immediately.
        proxy_buffering off;
        proxy_cache_bypass $http_upgrade;
    }
}
